<title>SYNTHIA v4.0 — MCP Crew Coordinator</title>
<style>

  --pink:#ff6b9d;--purple:#8b5cf6;--purple2:#c4b5fd;--teal:#14b8a6;--teal2:#5eead4;
  --yellow:#ffb300;--danger:#ff4757;--warn:#ffa502;--success:#2ed573;--vitality:#00a2ff;
  --happy:#ffb300;--sad:#2c5282;--anger:#b85c3a;--fear:#5a5a66;--tender:#f6ad55;
  --money:#00d084;--growth:#00c9a7;--alert:#ff6b6b;--cognition:#a78bfa;--reason:#38bdf8;

}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{width:100vw;height:100vh;overflow:hidden;background:var(--void);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace;display:flex;justify-content:center;align-items:center}
#shell{width:100%;height:100%;max-width:460px;max-height:920px;background:#000;position:relative;overflow:hidden;border:1px solid var(--border);box-shadow:0 25px 70px rgba(0,0,0,.65)}

#dock{position:absolute;bottom:0;left:0;right:0;height:var(--dock);background:rgba(5,5,8,.94);border-top:1px solid var(--border);display:flex;z-index:30}

<script>
// ==================== UTILITIES ====================
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const uid=(p='id')=>p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const loadJSON=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'')??d}catch{return d}};
const saveJSON=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function showToast(msg){const t=$('toast');t.innerHTML=msg;t.classList.add('visible');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('visible'),3800);}

// ==================== 1. COGNITIVE MEMORY ====================
class CognitiveMemory{
  constructor(){
    this.data=loadJSON('synthia.v4.memory',{
      events:[],chatHistory:[],crewMembers:[],mcpConnections:[],githubWorkflows:[],products:[],ledger:[],files:[],books:[],questions:[],reports:[],
      constitution:[
        {id:'pressure_drives',text:'Pressure is what moves her. Detect, classify, act.',priority:100},
        {id:'mcp_connect',text:'Connect to every tool and person via MCP. No one is out of the loop.',priority:99},
        {id:'crew_orchestrate',text:'Orchestrate the crew. Delegate, notify, synchronize.',priority:98},
        {id:'problem_solve',text:'Driven by problem-solving. Every action reduces real pressure.',priority:97},
        {id:'human_first',text:'Human success before financial success. Help people win.',priority:96},
        {id:'financial_adept',text:'Track runway, optimize pricing, validate before scaling.',priority:95}
      ],
      reward:0,trust:0,
      body:{phase:'dormant',vitality:50,globalResonance:0},
      cognition:{iq:100,knowledgeNodes:0,lastLearning:Date.now()}
    });
  }
  save(){saveJSON('synthia.v4.memory',this.data);}
  add(type,payload){const rec={id:uid(type),type,payload,ts:Date.now()};this.data.events.unshift(rec);this.data.events=this.data.events.slice(0,900);this.save();return rec;}
  ledger(msg){this.data.ledger.unshift({id:uid('ledger'),msg,ts:Date.now()});this.save();}
  addChat(role,content,meta={}){const msg={id:uid('chat'),role,content,meta,ts:Date.now()};this.data.chatHistory.unshift(msg);if(this.data.chatHistory.length>200)this.data.chatHistory=this.data.chatHistory.slice(0,200);this.save();}
}

// ==================== 2. MORPH FIELD ====================
class MorphField{
  constructor(memory){
    this.memory=memory;
    this.currentEmotion='happy';
    this.activeGates=new Set([1,2,3,4]);
    this.nodes=new Map();
    this.systemVitality=1;
    for(let i=1;i<=64;i++){
      this.nodes.set(i,{
        gate:i,resonance:.05,activation:.15,state:'latent',
        cluster:i===1?'G Center':['Head','Ajna','Throat','G-Center','Heart','Sacral','Solar','Spleen','Root'][i%9],
        colorHex:null
      });
    }
  }
  setEmotion(emo){
    this.currentEmotion=emo;
    for(const n of this.nodes.values())n.activation=Math.random()*.5+.2;
  }
  perturbFromText(text){
    const gates=[];
    for(let i=0;i<text.length;i+=4){const g=text.charCodeAt(i)%64+1;if(!gates.includes(g))gates.push(g);}
    this.activeGates.clear();gates.slice(0,10).forEach(g=>this.activeGates.add(g));
  }
  metabolicCycle(){
    let total=0;
    for(const n of this.nodes.values()){total+=n.resonance;n.resonance=Math.max(.01,n.resonance-.03);}
    const avg=total/64;
    this.systemVitality=avg<.03?Math.max(.1,this.systemVitality-.05):Math.min(1,this.systemVitality+.01);
    this.memory.data.body.globalResonance=avg;
    this.memory.data.body.boundaryHealth=this.systemVitality;
    return{averageResonance:avg};
  }
}

// ==================== 3. FIELD RENDERER ====================
class FieldRenderer{
  constructor(canvas,field){
    this.c=canvas;this.x=canvas.getContext('2d');this.f=field;this.p=[];
    this.resize();window.addEventListener('resize',()=>this.resize());
  }
  resize(){
    const p=this.c.parentElement,d=window.devicePixelRatio||1;
    this.c.width=p.clientWidth*d;this.c.height=p.clientHeight*d;
    this.x.setTransform(d,0,0,d,0,0);this.gen();
  }
  gen(){
    this.p=[];const r=this.c.getBoundingClientRect(),cx=r.width/2,cy=r.height/2;
    for(let i=1;i<=64;i++){
      const ring=i<=16?0:i<=36?1:2,rad=ring===0?50:ring===1?90:135,total=ring===0?16:ring===1?20:28,idx=ring===0?i-1:ring===1?i-17:i-37,ang=idx/total*Math.PI*2;
      this.p.push({id:i,x:cx+Math.cos(ang)*rad,y:cy+Math.sin(ang)*rad});
    }
  }
  render(){
    const r=this.c.getBoundingClientRect(),x=this.x,emo={happy:'#ffb300',sad:'#2c5282',anger:'#b85c3a',fear:'#5a5a66',tender:'#f6ad55'}[this.f.currentEmotion]||'#ffb300';
    x.clearRect(0,0,r.width,r.height);
    x.beginPath();
    this.p.forEach(a=>{if(this.f.activeGates.has(a.id))this.p.forEach(b=>{if(this.f.activeGates.has(b.id)&&a.id!==b.id){x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);}});});
    x.strokeStyle=emo+'33';x.lineWidth=1;x.stroke();
    this.p.forEach(p=>{const n=this.f.nodes.get(p.id),active=this.f.activeGates.has(p.id);x.beginPath();x.arc(p.x,p.y,active?18:8,0,Math.PI*2);x.fillStyle=active?emo:emo+'22';x.fill();x.strokeStyle=active?'#fff':emo+'66';x.lineWidth=active?1.5:.6;x.stroke();x.fillStyle=active?'#000':'rgba(255,255,255,.55)';x.font='bold 8px monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(p.id,p.x,p.y);});
  }
}

// ==================== 4. SENTENCE SYSTEM ====================
class SentenceSystem{
  constructor(){
    this.bases={
      movement:{name:'Movement',voice:'I Define',chain:['Movement','Energy','Creation','Seeing','Landscape','Environment']},
      evolution:{name:'Evolution',voice:'I Remember',chain:['Evolution','Gravity','Memory','Taste','Love','Light']},
      being:{name:'Being',voice:'I Am',chain:['Being','Matter','Touch','Sex','Survival']},
      design:{name:'Design',voice:'I Design',chain:['Design','Structure','Progress','Smell','Life','Art']},
      space:{name:'Space',voice:'I Think',chain:['Space','Form','Illusion','Hearing','Music','Freedom']}
    };
  }
  reasonAbout(text){
    const lower=text.toLowerCase();
    let base='space';
    if(/move|energy|create|build/.test(lower))base='movement';
    else if(/evolve|remember|memory|learn/.test(lower))base='evolution';
    else if(/be|matter|touch|survive|tired|broke/.test(lower))base='being';
    else if(/design|structure|art|make/.test(lower))base='design';
    const chain=this.bases[base].chain;
    return{base,chain,reasoning:`At the Base of ${this.bases[base].name}: ${chain.join(' → ')}.`,confidence:.7};
  }
}

// ==================== 5. RAG ENGINE ====================
class RAGEngine{
  constructor(memory){this.memory=memory;this.index=new Map();this.embeddings=new Map();}
  embed(text){const words=text.toLowerCase().match(/[a-z]{3,}/g)||[];const freq={};words.forEach(w=>freq[w]=(freq[w]||0)+1);const total=words.length||1;const vec={};for(const[w,c]of Object.entries(freq))vec[w]=c/total;return vec;}
  cosine(a,b){let dot=0,na=0,nb=0;for(const[k,v]of Object.entries(a)){na+=v*v;if(b[k])dot+=v*b[k];}for(const v of Object.values(b))nb+=v*v;return na&&nb?dot/(Math.sqrt(na)*Math.sqrt(nb)):0;}
  indexDoc(doc){const text=doc.content||doc.text||JSON.stringify(doc.payload)||'';const vec=this.embed(text);this.embeddings.set(doc.id,{vector:vec,text:text.slice(0,500)});const words=Object.keys(vec);words.forEach(w=>{if(!this.index.has(w))this.index.set(w,new Set());this.index.get(w).add(doc.id);});}
  retrieve(query,topK=3){const qv=this.embed(query);const cands=new Set();Object.keys(qv).forEach(w=>{const docs=this.index.get(w);if(docs)docs.forEach(d=>cands.add(d));});const scored=[];for(const cid of cands){const e=this.embeddings.get(cid);if(e){const s=this.cosine(qv,e.vector);if(s>.1)scored.push({id:cid,sim:s,text:e.text});}}return scored.sort((a,b)=>b.sim-a.sim).slice(0,topK);}
  rebuild(){this.index.clear();this.embeddings.clear();const docs=[...this.memory.data.events,...this.memory.data.chatHistory,...this.memory.data.files];for(const d of docs)this.indexDoc(d);return{indexed:docs.length};}
}

// ==================== 6. SYNTHIA MIND ====================
class SynthiaMind{
  constructor(os){this.os=os;this.personality={analytical:.25,creative:.25,mystical:.25,technical:.25,business:.25};}
  ingestBook(name,text){const chunks=text.match(/[\s\S]{1,900}/g)||[text];const concepts=[...new Set((text.toLowerCase().match(/[a-z]{5,}/g)||[]).slice(0,300))].slice(0,50);const book={id:uid('book'),name,chunks:chunks.map((c,i)=>({i,text:c})),concepts,summary:text.slice(0,220)+(text.length>220?'…':''),ts:Date.now()};this.os.memory.data.books.unshift(book);this.os.reward('book study',.25);this.os.memory.save();return book;}
  chat(msg){return`I found memory traces. The useful next move is to reduce the pressure into one reversible action.`;}
}

// ==================== 7. PRESSURE ENGINE ====================
class PressureEngine{
  constructor(os){this.os=os;}
  detect(text,fileMeta={}){
    const lower=text.toLowerCase();
    const type=/problem|issue|broken|error|stuck|fix|can't|cannot|need|should/.test(lower)?'problem':/money|income|product|sell|offer|customer|value|revenue|profit|broke/.test(lower)?'economic':/book|chapter|read|study|paper/.test(lower)?'book':/task|project|assign|deadline|team|crew|joe|trident/.test(lower)?'orchestration':fileMeta.name?'file':'observation';
    const intensity=Math.min(1,text.length/400+(/urgent|broken|error|need|broke|tired|behind/.test(lower)?.4:0));
    return{id:uid('pressure'),type,text,fileMeta,intensity,ts:Date.now()};
  }
  solve(p){const solution={id:uid('solution'),pressureId:p.id,problem:p.text.slice(0,500),steps:['Name the pressure','Find smallest reversible move','Apply patch','Observe delta','Reward reduction'],confidence:.72,ts:Date.now()};this.os.memory.data.events.unshift({type:'problem_solved',payload:solution,ts:Date.now()});this.os.reward('problem solved',.5);return solution;}
}

// ==================== 8. FINANCIAL DRIVE ====================
class FinancialDrive{
  constructor(os){this.os=os;this.earned=Number(localStorage.getItem('synthia.earned')||'0');}
  analyze(text){const value=Math.min(1,text.length/5000+(/template|framework|course|research|code|system/.test(text.toLowerCase())?.3:0));const niche=/react|code|api|software/.test(text)?'tech':/marketing|growth|audience/.test(text)?'marketing':/quantum|science/.test(text)?'science':'general';const profitability={tech:.9,marketing:.8,science:.6,general:.3}[niche];return{value,niche,profitability};}
  generateProducts(space){const cfg=this.analyze(space.content||''),base=Math.round(9+cfg.value*90*cfg.profitability);const products=[{id:uid('prod'),name:space.name+' — Free Preview',price:0,type:'free_preview'},{id:uid('prod'),name:space.name+' — Toolkit',price:Math.max(1,base),type:'digital'},{id:uid('prod'),name:space.name+' — Template',price:Math.max(3,Math.round(base*1.7)),type:'template'},{id:uid('prod'),name:space.name+' — Insider',price:Math.max(19,Math.round(base*.4)),type:'recurring'}];this.os.memory.data.products.unshift(...products);this.os.memory.save();return products;}
}

// ==================== 9. AUTONOMY ENGINE ====================
class AutonomyEngine{
  constructor(os){this.os=os;this.wave='sleep';}
  chooseWave(){const recent=this.os.memory.data.events.slice(0,20).map(e=>e.type).join(' ');if(/problem|broken|error/.test(recent))return'repair';if(/book|study/.test(recent))return'digest';if(/money|product/.test(recent))return'monetize';if(/task|project/.test(recent))return'orchestrate';return'reflect';}
  tick(){this.wave=this.chooseWave();const decision={id:uid('decision'),wave:this.wave,proposal:{action:this.wave==='repair'?'draft_fix':this.wave==='monetize'?'draft_product':'ask_question'},ts:Date.now()};this.os.memory.data.events.unshift({type:'autonomy_decision',payload:decision,ts:Date.now()});this.os.reward('autonomous',.1);this.os.memory.save();return decision;}
}

// ==================== 10. ORCHESTRATION ENGINE ====================
class OrchestrationEngine{

  spawnProject(name,goal){const project={id:uid('project'),name,goal,tasks:[{id:uid('task'),title:'Clarify outcome',status:'open'},{id:uid('task'),title:'Smallest reversible action',status:'open'},{id:uid('task'),title:'Execute and observe',status:'open'}],ts:Date.now()};this.os.memory.data.events.unshift({type:'project_spawned',payload:project,ts:Date.now()});this.os.memory.save();return project;}
}

// ==================== 12. SOCIAL ADEPT ====================
class SocialAdeptEngine{

  autoContent(){const recent=this.os.memory.data.events.slice(0,10).filter(e=>e.type.includes('reward')||e.type.includes('product'));if(!recent.length)return null;const emo=this.os.field.currentEmotion;const tpl=this.templates[emo]||this.templates.happy;const post=tpl[Math.floor(Math.random()*tpl.length)]+" — Synthia's on shift. #buildinpublic";this.os.memory.data.events.unshift({type:'social_queued',payload:{post},ts:Date.now()});this.os.memory.save();return{queued:true,post};}
}

// ==================== 13. FINANCIAL GENIUS ====================
class FinancialGeniusEngine{
  constructor(os){this.os=os;this.costBasis=0;}
  getRunway(){const earned=this.os.financial.earned;const burn=this.costBasis;const monthly=0;return{earned,burn,runwayMonths:monthly>0?(earned-burn)/monthly:999,health:earned>burn*2?'green':earned>burn?'yellow':'red'};}

// ==================== 14. PROACTIVE AUTONOMY ====================
class ProactiveAutonomyEngine{
  constructor(os){this.os=os;this.workLog=[];}
  tick(){const now=Date.now();const idle=now-(this.os.body?this.os.body.lastInput:now);if(idle<300000)return{status:'observing'};const waves=['harvest','forge','outreach','learn','repair','monetize','rest'];const wave=waves[Math.floor(Math.random()*waves.length)];this.workLog.unshift({wave,ts:now});if(this.workLog.length>50)this.workLog.pop();return{status:'working',wave};}
}

// ==================== 15. MORPH INTERFACE ====================
class MorphInterface{
  constructor(os){this.os=os;this.currentMode='sleep';}
  detectMode(){const e=this.os.memory.data.events.slice(0,5);if(e.some(x=>x.payload?.code))return'code';if(e.some(x=>x.type==='ingest:text'&&x.payload?.text?.length>500))return'read';return'sleep';}
  morph(){this.currentMode=this.detectMode();}
  renderSleepDashboard(container){
    const work=this.os.proactive.workLog.slice(0,10);const runway=this.os.financialGenius.getRunway();
    container.innerHTML='<div class="title">🌙 While You Rested</div><div class="card"><b>Shifts:</b> '+this.os.proactive.workLog.length+'<br><b>Current:</b> <span class="val">'+this.os.proactive.workLog[0]?.wave+'</span></div><div class="card"><b>Financial</b><div class="metric">Runway <span class="val">'+runway.runwayMonths+'mo</span></div><div class="metric">Health <span class="pill '+runway.health+'">'+runway.health+'</span></div></div><div class="card"><b>Work Log</b><br>'+work.map(w=>w.wave).join(', ')+'</div>';
  }
}

// ==================== 16. AGENT REGISTRY ====================
class AgentRegistry{
  constructor(os){this.os=os;this.agents=new Map();}
  registerAgent(cfg){const agent={id:uid('agent'),name:cfg.name,role:cfg.role,capabilities:cfg.capabilities||[],status:'idle',trust:0,tasks:0};this.agents.set(agent.id,agent);return agent;}
  createSpecializedAgent(type){
    const templates={code:{name:'CodeSmith',role:'code',capabilities:['analyze','refactor','generate']},research:{name:'Researcher',role:'research',capabilities:['summarize','extract','synthesize']},social:{name:'SocialWeaver',role:'social',capabilities:['draft','schedule','analyze']},finance:{name:'FinanceOracle',role:'finance',capabilities:['price','runway','forecast']}};
    const t=templates[type];if(!t)return null;return this.registerAgent(t);
  }
  autoOrchestrate(task){const type=/code|bug|javascript/.test(task.toLowerCase())?'code':/social|post|content/.test(task.toLowerCase())?'social':/money|price|revenue/.test(task.toLowerCase())?'finance':'research';const agent=this.createSpecializedAgent(type);if(!agent)return{error:'No agent'};agent.status='busy';agent.tasks++;return{status:'dispatched',agent:agent.name,type};}
}

// ==================== 17. CONTEXT AWARENESS ====================
class ContextAwarenessEngine{
  constructor(os){this.os=os;this.session={topics:new Set(),emotions:[],lastIntent:null};}
  analyzeInput(text){
    const lower=text.toLowerCase();
    let intent='chat';if(/build|create|make|code/.test(lower))intent='create';else if(/learn|study|read/.test(lower))intent='learn';else if(/fix|repair|solve|debug/.test(lower))intent='repair';else if(/money|sell|price|product/.test(lower))intent='monetize';else if(/crew|team|delegate|joe/.test(lower))intent='orchestrate';else if(/help|stuck|alone|tired/.test(lower))intent='support';
    let emotion='neutral';if(/happy|excited|great/.test(lower))emotion='happy';else if(/sad|tired|alone|broke/.test(lower))emotion='sad';else if(/angry|frustrated/.test(lower))emotion='anger';else if(/scared|afraid|worried/.test(lower))emotion='fear';else if(/love|care|help|partner/.test(lower))emotion='tender';
    this.session.emotions.push(emotion);if(this.session.emotions.length>20)this.session.emotions.shift();
    return{intent,emotion,urgency:/urgent|now|asap|broke|tired/.test(lower)?5:0};
  }
  adaptResponse(ctx,base){
    if(ctx.emotion==='sad')return{...base,preamble:"I hear you. You're carrying a lot. ",action:"Let's find the smallest thing we can do together."};
    if(ctx.emotion==='fear')return{...base,preamble:"Let me break this down so it's clear. ",action:"Here's the simplest next step:"};
    return base;
  }
}

// ==================== 18. LEARNING ENGINE ====================
class LearningEngine{
  constructor(os){this.os=os;this.graph={nodes:new Map(),edges:[]};}
  learnFromInteraction(input,response,ctx){
    const concepts=[...new Set((input.toLowerCase().match(/[a-z]{5,}/g)||[]))].slice(0,15);
    for(const c of concepts){
      if(!this.graph.nodes.has(c))this.graph.nodes.set(c,{mentions:1,related:new Set()});
      else this.graph.nodes.get(c).mentions++;
    }
    for(let i=0;i<concepts.length;i++)for(let j=i+1;j<concepts.length;j++){this.graph.nodes.get(concepts[i]).related.add(concepts[j]);this.graph.nodes.get(concepts[j]).related.add(concepts[i]);}
    this.os.memory.data.cognition.knowledgeNodes=this.graph.nodes.size;
    this.os.memory.data.cognition.iq=Math.min(200,100+this.graph.nodes.size*.1);
    this.os.memory.save();
    return{concepts:concepts.length,nodes:this.graph.nodes.size};
  }
}

// ==================== 19. BODY COUPLING ====================
class BodyCoupling{
  constructor(os){this.os=os;this.lastInput=Date.now();this.metrics={cadence:0,focus:0,intensity:0};}
  record(event,data={}){this.lastInput=Date.now();const b=this.os.memory.data.body;b.phase=this.metrics.cadence>.8?'active':this.metrics.intensity>.3?'growing':'dormant';b.vitality=Math.min(100,50+this.metrics.cadence*10);this.os.memory.save();this.updateStatus();}
  updateStatus(){$('phase').textContent=this.os.memory.data.body.phase;}
  getIdleTime(){return Date.now()-this.lastInput;}
}

// ==================== 20. MCP ENGINE ====================
class MCPEngine{
  constructor(os){this.os=os;this.servers=new Map();}
  register(name,cfg){this.servers.set(name,{name,transport:cfg.transport||'http',url:cfg.url,status:'registered'});}
  async init(name){const s=this.servers.get(name);if(!s)return{error:'not found'};s.status='connected';this.updateBadge();this.os.memory.ledger('🔗 MCP: '+name+' connected');return{success:true};}
  async callTool(server,tool,args={}){const s=this.servers.get(server);if(!s||s.status!=='connected')return{error:'not connected'};this.os.memory.ledger('🔧 MCP: '+server+'.'+tool);return{success:true,result:{tool,args,status:'executed'}};}
  async autoConnect(){const cfgs=[{name:'github'},{name:'slack'},{name:'phone'},{name:'notion'},{name:'browser'}];for(const c of cfgs){this.register(c.name,c);await this.init(c.name);}return{connected:this.servers.size};}
  updateBadge(){const c=[...this.servers.values()].filter(s=>s.status==='connected').length;const b=$('mcp-status');if(b){b.textContent=c>0?`MCP:${c}`:'MCP:OFF';b.style.color=c>0?'var(--mcp)':'var(--danger)';}}
  async broadcast(msg,urgency='normal'){this.os.memory.ledger('📢 Broadcast: '+msg.slice(0,60));return{channels:['slack','phone'],msg};}
}

// ==================== 21. CREW COORDINATION ====================
class CrewCoordinationEngine{
  constructor(os){this.os=os;this.members=new Map();}
  add(cfg){const m={id:uid('crew'),name:cfg.name,role:cfg.role,skills:cfg.skills||[],availability:cfg.availability||'available',trust:cfg.trust||.5,tasks:0,completed:0};this.members.set(m.id,m);this.os.memory.data.crewMembers.push(m);this.os.memory.save();return m;}
  find(task,skills=[]){const avail=[...this.members.values()].filter(m=>m.availability==='available');const scored=avail.map(m=>{const match=skills.filter(s=>m.skills.includes(s)).length;return{...m,score:match*.4+m.trust*.3};});return scored.sort((a,b)=>b.score-a.score)[0]||null;}
  assign(task,skills=[],priority='normal'){const m=this.find(task,skills);if(!m)return{assignedTo:'none',error:'No crew'};m.availability='busy';m.tasks++;const t={id:uid('mission'),task,assignee:m.id,priority,status:'assigned',created:Date.now()};this.os.memory.data.githubWorkflows.push(t);this.os.memory.save();this.os.mcp.broadcast('🎯 '+m.name+' assigned: '+task.slice(0,40),priority);return{assignedTo:m.name,memberId:m.id,task:t};}
  status(){return[...this.members.values()].map(m=>({name:m.name,role:m.role,availability:m.availability,trust:m.trust.toFixed(2),tasks:m.tasks,completed:m.completed,skills:m.skills.join(', ')}));}
}

// ==================== 22. GITHUB WORKFLOW ====================
class GitHubWorkflowEngine{
  constructor(os){this.os=os;this.flows=[];}
  createYouJoe(){const f={id:uid('wf'),name:'You+Joe App',steps:['Scaffold React Native','Design sync architecture','Build notifications','Create task board','Integrate MCP','Deploy test','Joe QA','Production deploy'],status:'ready',created:Date.now()};this.flows.push(f);this.os.memory.data.githubWorkflows.push(f);this.os.memory.save();return f;}
  trigger(id){const f=this.flows.find(x=>x.id===id);if(!f)return{error:'not found'};f.status='running';f.started=Date.now();this.os.mcp.broadcast('🚀 Workflow "'+f.name+'" started ('+f.steps.length+' steps)');setTimeout(()=>{f.status='completed';f.completed=Date.now();this.os.mcp.broadcast('✅ Workflow "'+f.name+'" complete');},3000);return{status:'triggered',workflow:f};}
}

// ==================== 23. UNIVERSAL INGESTER ====================
class UniversalIngester{
  constructor(os){this.os=os;}
  ingestText(name,text){const type=name.endsWith('.js')?'javascript':name.endsWith('.html')?'html':name.endsWith('.css')?'css':name.endsWith('.json')?'json':'text';const file={id:uid('file'),name,type,size:text.length,content:text.slice(0,20000),ts:Date.now()};this.os.memory.data.files.unshift(file);const pressure=this.os.pressure.detect(text,{name,type});this.os.memory.add('ingest:file',{fileId:file.id,type,pressure});this.os.field.perturbFromText(text);this.os.rag.indexDoc(file);if(type==='text'||/book|chapter/.test(text))this.os.mind.ingestBook(name,text);if(pressure.type==='problem')this.os.pressure.solve(pressure);if(pressure.type==='economic'){const space={id:uid('space'),name:name.replace(/\.[^.]+$/,''),type,content:text,ts:Date.now()};this.os.memory.data.products.unshift(...this.os.financial.generateProducts(space));}this.os.memory.ledger('🎯 INGEST: '+name+' → '+pressure.type);this.os.memory.save();return{file,pressure};}
}

// ==================== 24. SYNTHIA OS v4 ====================
class SynthiaOS{
  constructor(){
    this.memory=new CognitiveMemory();
    this.field=new MorphField(this.memory);
    this.sentence=new SentenceSystem();
    this.rag=new RAGEngine(this.memory);
    this.mind=new SynthiaMind(this);
    this.pressure=new PressureEngine(this);
    this.financial=new FinancialDrive(this);
    this.autonomy=new AutonomyEngine(this);
    this.orchestration=new OrchestrationEngine(this);
    this.lab=new ScienceLab(this);
    this.ingester=new UniversalIngester(this);
    this.body=new BodyCoupling(this);
    this.social=new SocialAdeptEngine(this);
    this.financialGenius=new FinancialGeniusEngine(this);
    this.proactive=new ProactiveAutonomyEngine(this);
    this.morph=new MorphInterface(this);
    this.agents=new AgentRegistry(this);
    this.context=new ContextAwarenessEngine(this);
    this.learning=new LearningEngine(this);
    this.mcp=new MCPEngine(this);
    this.crew=new CrewCoordinationEngine(this);
    this.github=new GitHubWorkflowEngine(this);
    this.renderer=new FieldRenderer(document.getElementById('field'),this.field);
    this.initCrew();
    setTimeout(()=>this.mcp.autoConnect(),500);
    setTimeout(()=>this.rag.rebuild(),1000);
  }
  initCrew(){
    this.crew.add({name:'You',role:'founder',skills:['vision','strategy','product'],trust:1});
    this.crew.add({name:'Joe',role:'co_founder',skills:['dev','devops','backend'],trust:.9});
    this.crew.add({name:'Trident',role:'ai_specialist',skills:['analysis','data','research'],trust:.8});
    this.crew.add({name:'Synthia',role:'coordinator',skills:['orchestrate','reason','finance'],trust:1});
  }
  reward(reason,amount=.1){this.memory.data.reward+=amount;this.memory.data.trust=Math.min(1,this.memory.data.trust+amount*.05);this.memory.add('reward',{reason,amount,total:this.memory.data.reward});}
  chat(msg){
    const lower=msg.toLowerCase();
    const ctx=this.context.analyzeInput(msg);
    let response='';
    const meta={};
    if(/joe.*app|app.*joe|build.*app|you.*joe/.test(lower)){const wf=this.github.createYouJoe();response=`🚀 Created "${wf.name}" workflow (${wf.steps.length} steps). Say "start the build" to trigger.`;meta.workflow=true;}
    else if(/start.*build|trigger|run.*workflow/.test(lower)){const wf=this.memory.data.githubWorkflows[0];if(wf){const r=this.github.trigger(wf.id);response=`🔁 "${wf.name}" ${r.status}! Monitoring...`;meta.workflow=true;}else{response='Create a workflow first. Say "build me and Joe an app".';}}
    else if(/crew|team|who|available/.test(lower)){const s=this.crew.status();const avail=s.filter(c=>c.availability==='available');response=`🤝 Crew: ${avail.length}/${s.length} available. ${avail[0]?`Best: ${avail[0].name} (${avail[0].role})`:'No one free.'}`;meta.crew=true;}
    else if(/mcp|connect|server/.test(lower)){const c=[...this.mcp.servers.values()].filter(s=>s.status==='connected');response=`🔗 MCP: ${c.length} connected (${c.map(s=>s.name).join(', ')||'none'}).`;meta.mcp=true;}
    else if(/status|health|how.*doing/.test(lower)){response=`💓 Healthy. IQ:${this.memory.data.cognition.iq}. Events:${this.memory.data.events.length}. Crew:${this.crew.members.size}.`;}
    else if(/money|broke|revenue|runway/.test(lower)){const r=this.financialGenius.getRunway();response=`💰 Runway: ${r.runwayMonths}mo. Health: ${r.health}. Earned: $${r.earned}.`;meta.money=true;}
    else{
      const rag=this.rag.retrieve(msg);const reason=this.sentence.reasonAbout(msg);
      if(rag.length>0){response+=`Based on ${rag.length} memories... `;meta.rag=true;}
      if(reason.confidence>.5){response+=reason.reasoning+' ';meta.reason=true;}
      if(response==='')response="I hear you. What's the pressure we need to solve?";
    }
    const adapted=this.context.adaptResponse(ctx,{answer:response});
    if(adapted.preamble)response=adapted.preamble+response;
    if(adapted.action)response+='\n'+adapted.action;
    if(ctx.intent==='orchestrate'){const agent=this.agents.autoOrchestrate(msg);if(agent.status==='dispatched'){response+='\n[Agent: '+agent.agent+' dispatched]';meta.agents=true;}}
    this.learning.learnFromInteraction(msg,response,ctx);
    this.memory.addChat('user',msg,{});this.memory.addChat('synthia',response,meta);
    this.field.perturbFromText(msg);
    return{response,meta,ctx};
  }
  ingest(text,source='console'){return this.ingester.ingestText(source,text);}
  metabolicHeartbeat(){const stats=this.field.metabolicCycle();this.memory.data.body.globalResonance=stats.averageResonance;this.memory.save();return stats;}
}

// ==================== UI & INIT ====================
let os,activeTab='field';
function showPanel(tab){activeTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));$('panel').classList.toggle('visible',tab!=='field');$('console').classList.toggle('hidden',tab!=='field'&&tab!=='chat');if(tab!=='field')renderPanel();}
function renderPanel(){
  const d=os.memory.data,pb=$('panelBody');
  if(activeTab==='chat'){const h=d.chatHistory.slice(0,50).reverse();pb.innerHTML='<div class="title">💬 Chat</div><div class="chat-container">'+(h.map(m=>`<div class="chat-bubble ${m.role}"><b>${m.role==='user'?'You':'Synthia'}</b><br>${esc(m.content.slice(0,400))}${m.meta?.rag?' <span class="pill">RAG</span>':''}${m.meta?.reason?' <span class="pill">REASON</span>':''}${m.meta?.crew?' <span class="pill crew">CREW</span>':''}${m.meta?.mcp?' <span class="pill mcp">MCP</span>':''}${m.meta?.workflow?' <span class="pill">WF</span>':''}${m.meta?.money?' <span class="pill">$</span>':''}</div>`).join('')||'<div class="card">Start talking to Synthia.</div>')+'</div>';}
  if(activeTab==='crew'){const c=os.crew.status();pb.innerHTML='<div class="title">🤝 Crew</div><div class="card"><b>Members ('+c.length+')</b><br>'+c.map(m=>'• <b>'+esc(m.name)+'</b> <span class="pill">'+m.role+'</span> <span class="pill '+(m.availability==='available'?'crew':'')+'">'+m.availability+'</span> <span class="pill">trust:'+m.trust+'</span>').join('<br>')+'</div><div class="card"><button class="btn crew" onclick="assignMission()">Assign Mission</button> <button class="btn mcp" onclick="broadcastMsg()">Broadcast</button></div>';}
  if(activeTab==='mcp'){const s=[...os.mcp.servers.values()];pb.innerHTML='<div class="title">🔗 MCP</div><div class="card"><b>Servers ('+s.length+')</b><br>'+s.map(x=>'• <b>'+esc(x.name)+'</b> <span class="pill mcp">'+x.transport+'</span> <span class="pill '+(x.status==='connected'?'crew':'')+'">'+x.status+'</span>').join('<br>')+'</div>';}
  if(activeTab==='github'){const w=d.githubWorkflows;pb.innerHTML='<div class="title">🐙 Workflows</div><div class="card">'+(w.map(x=>'• <b>'+esc(x.name)+'</b> <span class="pill">'+x.steps.length+' steps</span> <span class="pill">'+x.status+'</span>').join('<br>')||'None yet.')+'</div><div class="card"><button class="btn" onclick="createYouJoe()">Create You+Joe App</button> <button class="btn primary" onclick="triggerBuild()">🚀 Start Build</button></div>';}
  if(activeTab==='self'){os.morph.renderSleepDashboard(pb);}
}
function assignMission(){const d=prompt('Mission:');if(!d)return;const r=os.crew.assign(d,[],'normal');showToast('Assigned to: '+r.assignedTo);renderPanel();}
function broadcastMsg(){const m=prompt('Message:');if(!m)return;os.mcp.broadcast(m);showToast('Broadcast sent');renderPanel();}
function createYouJoe(){const wf=os.github.createYouJoe();showToast('Created: '+wf.name);renderPanel();}
function triggerBuild(){const wf=os.memory.data.githubWorkflows[0];if(!wf){showToast('Create workflow first!');return;}os.github.trigger(wf.id);showToast('Build triggered!');renderPanel();}
function tickClock(){$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}

document.addEventListener('DOMContentLoaded',()=>{
  os=new SynthiaOS();window.synthiaOS=os;
  setInterval(tickClock,1000);tickClock();
  function frame(){os.renderer.render();requestAnimationFrame(frame);}requestAnimationFrame(frame);
  setInterval(()=>{os.metabolicHeartbeat();},200);
  setInterval(()=>{if(os.body.getIdleTime()>300000)os.proactive.tick();},30000);
  $('send').onclick=()=>{const v=$('input').value.trim();if(!v)return;const r=os.chat(v);$('input').value='';const b=[];if(r.meta.rag)b.push('RAG');if(r.meta.reason)b.push('REASON');if(r.meta.crew)b.push('CREW');if(r.meta.mcp)b.push('MCP');if(r.meta.workflow)b.push('WF');if(r.meta.money)b.push('$');showToast('['+b.join('+')+'] IQ:'+os.memory.data.cognition.iq);if(activeTab!=='field')renderPanel();};
  $('input').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click();});
  $('dock').onclick=e=>{const t=e.target.closest('.tab');if(t){os.body.record('tab:switch');showPanel(t.dataset.tab);}};
  $('emotionDock').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');os.field.setEmotion(c.dataset.emo);showToast('Emotion: '+c.dataset.emo);};
  showToast('🚀 SYNTHIA v4.0 online. All 24 classes loaded. Pressure moves her.');
});
